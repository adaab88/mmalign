[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adaab88-mmalign"
version = "0.1.0"
description = "比对提示中引用的图像元素与实际图像，标出指代错位"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "adaab88" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://adaab88.github.io"
Repository = "https://github.com/adaab88/mmalign"
Issues = "https://github.com/adaab88/mmalign/issues"

[project.scripts]
mmalign = "mmalign:main"

[tool.setuptools]
py-modules = ["mmalign"]
